# DevOps-Factory: Standard CI Template
# Copy this to .github/workflows/ci.yml in target repos
# Auto-detects stack (Node.js, Next.js, .NET) and runs appropriate checks

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: src/ClaudeLauncher

jobs:
  detect-stack:
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.detect.outputs.stack }}
      package-manager: ${{ steps.detect.outputs.package_manager }}
      pnpm-version: ${{ steps.detect.outputs.pnpm_version }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          if compgen -G "*.csproj" > /dev/null || compgen -G "*.sln" > /dev/null; then
            echo "stack=dotnet" >> $GITHUB_OUTPUT
          elif [ -f "next.config.js" ] || [ -f "next.config.mjs" ] || [ -f "next.config.ts" ]; then
            echo "stack=nextjs" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ]; then
            echo "stack=node" >> $GITHUB_OUTPUT
          else
            echo "::error::No supported project in this working directory; configure project-specific checks"
            exit 1
          fi

          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            echo "package_manager=bun" >> $GITHUB_OUTPUT
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "package_manager=pnpm" >> $GITHUB_OUTPUT
          elif [ -f "yarn.lock" ]; then
            echo "package_manager=yarn" >> $GITHUB_OUTPUT
          else
            echo "package_manager=npm" >> $GITHUB_OUTPUT
          fi
          PNPM_VERSION=$(node -e "const fs=require('fs'); const p=fs.existsSync('package.json')?require('./package.json'):{}; const m=/^pnpm@([0-9]+\.[0-9]+\.[0-9]+)/.exec(p.packageManager || ''); console.log(m?m[1]:'9')")
          echo "pnpm_version=$PNPM_VERSION" >> $GITHUB_OUTPUT

  ci-node:
    needs: detect-stack
    if: needs.detect-stack.outputs.stack == 'node' || needs.detect-stack.outputs.stack == 'nextjs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: needs.detect-stack.outputs.package-manager == 'pnpm'
        with:
          version: ${{ needs.detect-stack.outputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ needs.detect-stack.outputs.package-manager != 'bun' && needs.detect-stack.outputs.package-manager || '' }}
          cache-dependency-path: src/ClaudeLauncher/*lock*

      - uses: oven-sh/setup-bun@v2
        if: needs.detect-stack.outputs.package-manager == 'bun'
        with:
          bun-version: '1.3.0'

      - name: Install dependencies
        run: |
          PM="${{ needs.detect-stack.outputs.package-manager }}"
          if [ "$PM" = "bun" ]; then
            bun install --frozen-lockfile
          elif [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "$PM" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        run: |
          PM="${{ needs.detect-stack.outputs.package-manager }}"
          SCRIPT=$(node -e "const p=require('./package.json'); console.log(['lint'].find(s => typeof p.scripts?.[s] === 'string') || '')")
          if [ -n "$SCRIPT" ]; then
            "$PM" run "$SCRIPT"
          else
            echo "::notice::lint not configured; no validation claimed"
          fi

      - name: Type check
        run: |
          PM="${{ needs.detect-stack.outputs.package-manager }}"
          SCRIPT=$(node -e "const p=require('./package.json'); console.log(['typecheck','tsc'].find(s => typeof p.scripts?.[s] === 'string') || '')")
          if [ -n "$SCRIPT" ]; then
            "$PM" run "$SCRIPT"
          else
            echo "::notice::typecheck not configured; no validation claimed"
          fi

      - name: Test with coverage
        run: |
          PM="${{ needs.detect-stack.outputs.package-manager }}"
          SCRIPT=$(node -e "const p=require('./package.json'); console.log(['test'].find(s => typeof p.scripts?.[s] === 'string') || '')")
          if [ -n "$SCRIPT" ]; then
            "$PM" run "$SCRIPT"
          else
            echo "::notice::tests not configured; no validation claimed"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/coverage-summary.json
          if-no-files-found: ignore

      - name: Build
        run: |
          PM="${{ needs.detect-stack.outputs.package-manager }}"
          $PM run build

  ci-dotnet:
    needs: detect-stack
    if: needs.detect-stack.outputs.stack == 'dotnet'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Document test coverage
        run: echo "::notice::Build verified; no .NET test project is configured in this directory"
